extends: base.yaml

experiment:
  name: classifier_cnn_128

model:
  architecture: ClassifierCNN
  norm_type: instance
  in_channels: 1
  expansion: 8
  feature_dim: 1024
  nhid: 512
  pretrained: false
  pretrained_checkpoint: null

augmentation:
  enabled: true
  noise_std: 0.0
  blur_sigma: [0.0, 1.5]

training:
  optimizer: adam
  betas: [0.9, 0.999]
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 4
  epochs: 100
  balanced_sampler: true
  weighted_loss: false