extends: colab_local_128.yaml

experiment:
  name: medicalnet_resnet18_128_colab
  output_dir: /content/drive/MyDrive/DG-TCAV_FYP_NUST/DG_TCAV_OUTPUTS/classifier_outputs

data:
  manifest_path: data/preprocessed_128_classifier_inputs/classifier_manifest.csv
  splits_path: data/preprocessed_128_classifier_inputs/classifier_splits.json
  volume_dir: /content/preprocessed_128
  reference_image: template/mni152.nii.gz

model:
  architecture: ResNet18
  num_classes: 4
  base_channels: 64
  shortcut: A
  pretrained: true
  pretrained_checkpoint: /content/drive/MyDrive/DG-TCAV_FYP_NUST/DG_TCAV_OUTPUTS/resnet_18_23dataset.pth
  # Set to a trusted digest to reject any different checkpoint; the run logs the actual digest.
  pretrained_checkpoint_sha256: 61224f9317fcce873366deb3703183e92cc47325b726b69691b33536244e10f4

augmentation:
  enabled: false

training:
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  min_learning_rate: 0.000001
  batch_size: 4
  epochs: 100
  balanced_sampler: true
  weighted_loss: false
  early_stopping_patience: 15
  num_workers: 2
  gradient_clip_norm: 1.0
  mixed_precision: true
  device: auto

evaluation:
  batch_size: 4
  num_workers: 2
  bootstrap_samples: 1000
