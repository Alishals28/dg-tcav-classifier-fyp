experiment:
  name: medicalnet_resnet18
  seed: 42
  output_dir: outputs
  smoke_test: false

data:
  manifest_path: data/preprocessed_128_classifier_inputs/classifier_manifest.csv
  splits_path: data/preprocessed_128_classifier_inputs/classifier_splits.json
  volume_dir: data/preprocessed_scans
  file_pattern: "{subject_id}_preprocessed_128.nii.gz"
  expected_shape: [128, 128, 128]
  expected_spacing: [1.1926161, 1.4749262, 1.2387075]
  spacing_tolerance: 0.03
  orientation: RAS
  normalization: none
  expected_split_sizes: {train: null, val: null, test: null}
  preprocessing_confirmed: true
  reference_image: template/mni152.nii.gz
  reference_grid_mode: same_fov
  reference_fov_tolerance_mm: 0.1

model:
  architecture: ResNet18
  num_classes: 4
  pretrained: false
  pretrained_checkpoint: null
  base_channels: 64
  shortcut: A

augmentation:
  enabled: false
  degrees: 5
  translation_mm: 2
  scales: 0.03
  noise_std: 0.01

training:
  optimizer: adamw
  betas: [0.9, 0.999]
  epochs: 50
  batch_size: 4
  num_workers: 2
  learning_rate: 0.0001
  weight_decay: 0.0001
  min_learning_rate: 0.000001
  weighted_loss: true
  early_stopping_patience: 10
  selection_metric: macro_f1
  mixed_precision: true
  gradient_clip_norm: 1.0
  device: auto

evaluation:
  batch_size: 4
  num_workers: 2
  bootstrap_samples: 1000
